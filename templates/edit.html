{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Edit Post</h1>

    <form method="POST">

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ post.title }}"
            required
        >


        <label for="content">
            Content
        </label>

        <textarea
            id="content"
            name="content"
            rows="10"
            required
        >{{ post.content }}</textarea>


        <div class="form-buttons">

            <a
                href="{{ url_for('index') }}"
                class="cancel">
                Cancel
            </a>

            <button
                type="submit"
                class="add-button">
                Update Post
            </button>

        </div>

    </form>

</div>

{% endblock %}
