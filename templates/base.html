<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flask MySQL Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="navbar">

            <a href="{{ url_for('index') }}"
               class="logo">
                My Flask Blog
            </a>

            <a href="{{ url_for('create') }}"
               class="add-button">
                + Create Post
            </a>

        </div>

    </nav>


    <main>

        {% block content %}

        {% endblock %}

    </main>

</body>

</html>
